# Run 010: fresh lineage (no init_path), 6M steps, per-episode morphology randomization (theta: link scales, springs,
# actuation mask; scene default morph/randomize = 1), hold-gate K curriculum 2 -> 10. Thresholds restated from the 150k
# smoke's reward scale: a completing grasp returns ~2.0 (shaping 0.9 + Q 0.2 + bonus 1.0 minus step costs), a non-grasping episode -1.5 to -2.0, so lessons advance at a smoothed mean reward of 1.0 (the pre-normalization config used 5.8).
behaviors:
  Prosthetic:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 6000000
    time_horizon: 128
    summary_freq: 10000
    threaded: true

environment_parameters:
  morph/randomize: 1.0
  hold_decisions:
    curriculum:
      - name: Hold2
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 1.0
        value: 2.0
      - name: Hold4
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 1.0
        value: 4.0
      - name: Hold6
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 1.0
        value: 6.0
      - name: Hold8
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 1.0
        value: 8.0
      - name: Hold10
        value: 10.0
