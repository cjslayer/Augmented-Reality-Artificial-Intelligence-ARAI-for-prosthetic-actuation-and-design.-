# Run 011 PHASE B (resume of run id 011 after hold/decisions reached 50): hold fixed at 50, perturbation curriculum.
behaviors:
  Prosthetic:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 250000
    max_steps: 6000000
    time_horizon: 128
    summary_freq: 10000
    threaded: true

environment_parameters:
  morph/randomize: 1.0
  hold/decisions: 50.0
  perturb/scale:
    curriculum:
      - name: Perturb0
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.9
        value: 0.0
      - name: Perturb25
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.9
        value: 0.25
      - name: Perturb50
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.9
        value: 0.5
      - name: Perturb75
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.9
        value: 0.75
      - name: Perturb100
        value: 1.0
