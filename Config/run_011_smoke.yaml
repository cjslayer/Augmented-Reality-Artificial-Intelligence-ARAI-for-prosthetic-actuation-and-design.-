# 150k SMOKE of run 011 (same settings, max_steps 150000). Run 011: first articulated lineage (branch articulated-hand). Fresh (no init_path), 6M steps, 8 headless envs of the
# Dynamic_Scene_Train player (spec-built human-scale PhysX hand, TGS solver, dt 10 ms, DecisionPeriod 10). Same PPO
# hyperparameters as run_010. Per-episode theta randomization (morph/randomize = 1). Perturbation curriculum on
# perturb/scale (0 -> 0.25 -> 0.5 -> 0.75 -> 1.0 of the 1.5 mg peak): a lesson advances at a smoothed mean episode reward
# of THRESHOLD_SET_AFTER_SMOKE (see the 150k smoke section in MLAGENTS_UPGRADE.md for the derivation). Seeds 5001-5100
# are reserved for evaluation and are never used here.
behaviors:
  Prosthetic:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 250000
    max_steps: 150000
    time_horizon: 128
    summary_freq: 10000
    threaded: true

environment_parameters:
  morph/randomize: 1.0
  perturb/scale:
    curriculum:
      - name: Perturb0
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 0.7
        value: 0.0
      - name: Perturb25
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 0.7
        value: 0.25
      - name: Perturb50
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 0.7
        value: 0.5
      - name: Perturb75
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 150
          threshold: 0.7
        value: 0.75
      - name: Perturb100
        value: 1.0
