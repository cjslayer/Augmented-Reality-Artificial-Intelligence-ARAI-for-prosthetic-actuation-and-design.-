# Run 012: the run-011 recipe at 12M steps, fresh lineage (no init_path, no resume across lineages). 8 headless envs of the
# Dynamic_Scene_Train player (spec-built human-scale PhysX hand, TGS solver, dt 10 ms, DecisionPeriod 10). Same PPO
# hyperparameters as run_010. Per-episode theta randomization (morph/randomize = 1). Seeds 5001-5100 are reserved for
# evaluation and are never used here.
# Curricula (ML-Agents advances each parameter's lessons independently on the smoothed mean episode reward, so the two
# ladders are run in two phases of the same run id): PHASE A (this file) = hold/decisions 5 -> 10 -> 20 -> 50 with
# perturb/scale fixed at 0. When hold/decisions reaches lesson 3 (K = 50) the run is stopped and resumed with
# run_012_phaseB.yaml (hold/decisions fixed 50, perturb/scale 0 -> 0.25 -> 0.5 -> 0.75 -> 1.0). Thresholds = the mean
# reward at ~70 % success for that lesson: a completing episode returns ~0.9 shaping + 0.1 gate + 0.2 hold + 1.0 bonus
# - existential (1.0 per 5000 steps) - ~0.3 safety / effort, i.e. ~1.8 at K = 5 (short episodes) down to ~1.5 at K = 50;
# a failing one -0.5 to -1.0. 70 % success: 1.0 (K 5), 1.0 (K 10), 0.95 (K 20), 0.9 (K 50 and every perturbation lesson).
behaviors:
  Prosthetic:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 250000
    max_steps: 12000000
    time_horizon: 128
    summary_freq: 10000
    threaded: true

environment_parameters:
  morph/randomize: 1.0
  perturb/scale: 0.0
  hold/decisions:
    curriculum:
      - name: Hold5
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 1.0
        value: 5.0
      - name: Hold10
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 1.0
        value: 10.0
      - name: Hold20
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.95
        value: 20.0
      - name: Hold50
        value: 50.0
