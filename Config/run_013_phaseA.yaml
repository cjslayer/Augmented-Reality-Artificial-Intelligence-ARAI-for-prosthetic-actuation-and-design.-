# Run 013 PHASE A: first policy on randomized object shapes (superquadric bank, train shapes 1-64) and, from phase B on, random stable
# presentation poses. Fresh lineage: no init_path, no resume across lineages; within-lineage resumes of run id 013 carry the phases.
# Player Builds/Run013/Prosthetic.exe (Dynamic_Scene_Train, Behavior Default, no model; bank shipped in StreamingAssets/ObjectBank), 8 headless
# envs. PPO hyperparameters = run 012. max_steps 20M in all three phase files so the linear learning-rate schedule is continuous across the
# within-lineage resumes (the step count lives in checkpoint.pt). Checkpoints every 250k, all kept (keep_checkpoints 81 >= 20M / 250k).
# Environment: object/mode 1 = trainUniform (bank indices 1-64, one draw per episode); mass log-uniform 0.2-1.5 kg and mu 1.0 are the scene
# defaults (as run 012, no key); morph/randomize 1 (per-episode theta, thumb-base-masked hands included).
# Curricula: PHASE A (this file) = hold/decisions 5 -> 10 -> 20 -> 50 on the run-012 reward thresholds, canonical presentation only
# (pose/canonicalFraction 1.0), no perturbation. Switch rule: when the Hold50 lesson has been entered AND >= 250k steps have elapsed in it,
# hard-stop and resume run id 013 from the latest checkpoint after entry with run_013_phaseB.yaml (lesson state written by hand, a fixed
# parameter at lesson 0; MLAGENTS_UPGRADE.md, run 011b / 012).
behaviors:
  Prosthetic:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 81
    checkpoint_interval: 250000
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000
    threaded: true

env_settings:
  env_path: Builds/Run013/Prosthetic.exe
  num_envs: 8

engine_settings:
  no_graphics: true

environment_parameters:
  morph/randomize: 1.0
  object/mode: 1.0
  pose/canonicalFraction: 1.0
  perturb/scale: 0.0
  hold/decisions:
    curriculum:
      - name: Hold5
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 1.0
        value: 5.0
      - name: Hold10
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 1.0
        value: 10.0
      - name: Hold20
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.95
        value: 20.0
      - name: Hold50
        value: 50.0
