# Run 013 PHASE B (within-lineage resume of run id 013 after Hold50 was entered and >= 250k steps elapsed in it): hold fixed at 50, no
# perturbation, presentation curriculum pose/canonicalFraction 1.0 -> 0.5 -> 0.0 (per episode a Bernoulli draw from the episode's stream
# selects the canonical pose or a random stable rest pose, ObjectBank.ApplyForEpisode). Thresholds = the run-012 K = 50 lesson threshold
# (0.9 smoothed mean reward, ~70 % success of that lesson's own task mix). min_lesson_length is in EPISODES (the trainer's reward buffer,
# cleared at every lesson change, trainer_controller.py:220); run 012's episodes averaged 63-92 decisions, so 100 episodes is only
# ~7-9k steps and let its perturbation lessons cascade; 1000 episodes (~80k steps) is used here (the brief's floor is 100).
# require_reset true: all envs reset at the lesson change so the next lesson's buffer fills with episodes drawn under the new fraction.
# Switch rule to phase C: canonicalFraction 0.0 (lesson Canon0) entered AND >= 250k steps elapsed in it -> hard stop, resume with
# run_013_phaseC.yaml from the latest checkpoint after entry.
behaviors:
  Prosthetic:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 81
    checkpoint_interval: 250000
    max_steps: 20000000
    time_horizon: 128
    summary_freq: 10000
    threaded: true

env_settings:
  env_path: Builds/Run013/Prosthetic.exe
  num_envs: 8

engine_settings:
  no_graphics: true

environment_parameters:
  morph/randomize: 1.0
  object/mode: 1.0
  perturb/scale: 0.0
  hold/decisions: 50.0
  pose/canonicalFraction:
    curriculum:
      - name: Canon100
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.9
          require_reset: true
        value: 1.0
      - name: Canon50
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.9
          require_reset: true
        value: 0.5
      - name: Canon0
        value: 0.0
