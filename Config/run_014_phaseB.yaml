# Run 014 attempt 2, PHASE B: within-lineage resume of run id 014_r2 from the A2 switch checkpoint, to 24M total. Fixed parameters, no lessons.
# Final mix: pose 50/50 canonical / random stable, perturbation 1.0, hold K = 50, lift budget 300, cylinder 10 %, digit shares unchanged.
# Lying success flat near zero for several million steps is expected and is not a stop condition (013's lying breakout took about 7M). Stop and report only if
# upright success falls by more than 0.15 from its value at the switch over two consecutive 1M windows. Extension decided at 24M.
behaviors:
  Prosthetic:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 120
    checkpoint_interval: 1000000
    max_steps: 24000000
    time_horizon: 128
    summary_freq: 10000
    threaded: true

env_settings:
  env_path: Builds/Run014/Prosthetic.exe
  num_envs: 8
  env_args: ["--topology", "slots", "--episodeLog", "C:/Users/chris/Augmented-Reality-Artificial-Intelligence/results/014_r2_episodes/B"]

engine_settings:
  no_graphics: true

environment_parameters:
  morph/randomize: 1.0
  object/mode: 1.0
  object/anchorShare: 0.1
  pose/canonicalFraction: 0.5
  hold/decisions: 50.0
  perturb/scale: 1.0
  task/liftBudgetSteps: 300.0
