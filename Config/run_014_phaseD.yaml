# Run 014 C/D (brief 2026-10-08), PHASE D: within-lineage resume of run id 014_r2 from the end-of-C checkpoint; 50/50 restore.
# = run_014_phaseB.yaml with max_steps 36M and checkpoints every 500k; every env param identical to B (pose 0.5, perturbation 1.0, K = 50, lift 300, cylinder 10 %).
# No curriculum block. End: pooled upright success >= 0.72 AND pooled lying success >= 0.30 over the same >= 500k window, or D+6M, or step 36M.
# If upright success has not recovered to >= 0.65 by D+3M, stop and report.
behaviors:
  Prosthetic:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 200
    checkpoint_interval: 500000
    max_steps: 36000000
    time_horizon: 128
    summary_freq: 10000
    threaded: true

env_settings:
  env_path: Builds/Run014/Prosthetic.exe
  num_envs: 8
  env_args: ["--topology", "slots", "--episodeLog", "C:/Users/chris/Augmented-Reality-Artificial-Intelligence/results/014_r2_episodes/D"]

engine_settings:
  no_graphics: true

environment_parameters:
  morph/randomize: 1.0
  object/mode: 1.0
  object/anchorShare: 0.1
  pose/canonicalFraction: 0.5
  hold/decisions: 50.0
  perturb/scale: 1.0
  task/liftBudgetSteps: 300.0
