# Run 014 throughput probe (Part 3, 3b): 100k steps, steps/s from the trainer log; stop if < 300.
# Slot layout (docs/design/014_topology.md): the player Builds/Run014/Prosthetic.exe (Dynamic_Scene_Train, default layout unchanged) selects it from
# env_args --topology slots; digit compositions per episode from MorphologyManager.digitDistribution P(3, 4, 5, 6a, 6b, 7) = (0.10, 0.15, 0.45, 0.075,
# 0.075, 0.15). Settings = the run-014 phase-A recipe: run-012 PPO hyperparameters, hold ladder 5 -> 10 -> 20 -> 50 with min_lesson_length 1000
# episodes, canonical presentation, no perturbation, trainUniform shapes 1-64 with anchor share 0.10, lift budget 300; morph/randomize 1.
# Spawn-envelope check (checkpoint 4 fix): run id 014_probe2, per-episode log in results/014_probe2_episodes.
# Fresh run id (no resume, no init_path).
behaviors:
  Prosthetic:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 81
    checkpoint_interval: 250000
    max_steps: 100000
    time_horizon: 128
    summary_freq: 10000
    threaded: true

env_settings:
  env_path: Builds/Run014/Prosthetic.exe
  num_envs: 8
  env_args: ["--topology", "slots", "--episodeLog", "C:/Users/chris/Augmented-Reality-Artificial-Intelligence/results/014_probe2_episodes"]

engine_settings:
  no_graphics: true

environment_parameters:
  morph/randomize: 1.0
  object/mode: 1.0
  pose/canonicalFraction: 1.0
  perturb/scale: 0.0
  object/anchorShare: 0.1
  task/liftBudgetSteps: 300.0
  hold/decisions:
    curriculum:
      - name: Hold5
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 1.0
        value: 5.0
      - name: Hold10
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 1.0
        value: 10.0
      - name: Hold20
        completion_criteria:
          measure: reward
          behavior: Prosthetic
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.95
        value: 20.0
      - name: Hold50
        value: 50.0
