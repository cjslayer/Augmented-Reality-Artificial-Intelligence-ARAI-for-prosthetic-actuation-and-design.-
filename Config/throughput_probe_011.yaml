# Throughput probe for the articulated hand (branch articulated-hand): NOT a training run. Same PPO settings as run_010.yaml,
# 20k steps, used only to measure environment steps per second with 8 headless envs (compare: run 010 kinematic build 12.3 s / 10k steps).
behaviors:
  Prosthetic:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 1
    max_steps: 20000
    time_horizon: 128
    summary_freq: 5000
    threaded: true
environment_parameters:
  morph/randomize: 1.0
